name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.3
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tickets
          POSTGRES_PASSWORD: tickets
          POSTGRES_DB: tickets
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tickets"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JWT_SECRET_KEY: chave-usada-somente-no-ci-para-rodar-os-testes
      DATABASE_URL: postgresql+psycopg://tickets:tickets@localhost:5432/tickets
      TEST_DATABASE_URL: postgresql+psycopg://tickets:tickets@localhost:5432/tickets
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrações (upgrade e downgrade)
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Testes
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t ticket-triage-api .
